use_default_settings: true

# Format json WAJIB diaktifkan agar API /search?format=json bisa dipakai web.
search:
  formats:
    - html
    - json

# Mesin ilmiah (kategori "science") — pencarian jurnal/referensi gratis tanpa API key.
engines:
  - name: crossref
    disabled: false
  - name: openalex
    disabled: false
  # Mesin web cadangan: mesin umum sering ditangguhkan (CAPTCHA/429) bila terlalu banyak query.
  # Hanya bing yang berfungsi dari server ini (mojeek: access denied, yahoo: parsing error — diuji, dinonaktifkan);
  # hasil bing kadang generik, jadi relevansi dijaga di aplikasi dan instance cadangan dipakai bila perlu.
  - name: bing
    disabled: false
outgoing:
  # Bawaan 3 dtk terlalu ketat: DuckDuckGo sering ConnectTimeout lalu ikut ditangguhkan.
  request_timeout: 6.0
  max_request_timeout: 10.0

server:
  # secret_key dioverride env SEARXNG_SECRET (di docker-compose).
  limiter: false
  public_instance: false
