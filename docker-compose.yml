# ============================================================
# zaltr.ai — stack infrastruktur TERISOLASI
# Project name : zaltr        (container zaltr-*, volume zaltr_*)
# Network      : zaltr-net    (bridge khusus proyek ini)
# Port host    : TIDAK ADA di file ini. Gunakan docker-compose.dev.yml
#                bila butuh akses dari host (loopback 46xxx).
# Web app      : BELUM dibuat — slot service "web" menyusul di fase web.
#
# Pakai lewat helper: bin/zaltrctl {init|up|down|status|backup-now|...}
# ============================================================

name: zaltr

networks:
  zaltr-net:
    name: zaltr-net
    driver: bridge
  # Network KHUSUS code-interpreter: internal (tanpa internet), hanya web<->runner.
  zaltr-exec:
    name: zaltr-exec
    driver: bridge
    internal: true

volumes:
  zaltr_pgdata:
  zaltr_redisdata:
  zaltr_miniodata:
  zaltr_ollama:
  zaltr_copilot_state:

secrets:
  zaltr_backup_pass:
    file: ./secrets/backup.pass
  zaltr_copilot_token:
    file: ./secrets/copilot_github_token

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: zaltr-postgres
    restart: unless-stopped
    networks: [zaltr-net]
    environment:
      POSTGRES_DB: ${ZALTR_POSTGRES_DB:?}
      POSTGRES_USER: ${ZALTR_POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${ZALTR_POSTGRES_PASSWORD:?}
      TZ: ${TZ:-Asia/Makassar}
    volumes:
      - zaltr_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    shm_size: 256mb

  redis:
    image: redis:7-alpine
    container_name: zaltr-redis
    restart: unless-stopped
    networks: [zaltr-net]
    command:
      [
        "redis-server",
        "--requirepass", "${ZALTR_REDIS_PASSWORD:?}",
        "--appendonly", "yes",
        "--maxmemory", "256mb",
        "--maxmemory-policy", "noeviction",
      ]
    volumes:
      - zaltr_redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${ZALTR_REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    environment:
      ZALTR_REDIS_PASSWORD: ${ZALTR_REDIS_PASSWORD:?}

  minio:
    image: minio/minio:latest
    container_name: zaltr-minio
    restart: unless-stopped
    networks: [zaltr-net]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${ZALTR_MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${ZALTR_MINIO_ROOT_PASSWORD:?}
      TZ: ${TZ:-Asia/Makassar}
    volumes:
      - zaltr_miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -sf http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 12

  # One-shot: buat bucket privat lalu keluar.
  minio-init:
    image: minio/mc:latest
    container_name: zaltr-minio-init
    networks: [zaltr-net]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -ec '
        mc alias set zaltr http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD";
        mc mb --ignore-existing "zaltr/$$BUCKET_FILES";
        mc mb --ignore-existing "zaltr/$$BUCKET_ASSETS";
        mc anonymous set none "zaltr/$$BUCKET_FILES";
        mc anonymous set none "zaltr/$$BUCKET_ASSETS";
        echo "minio-init: bucket siap";
      '
    environment:
      MINIO_ROOT_USER: ${ZALTR_MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${ZALTR_MINIO_ROOT_PASSWORD:?}
      BUCKET_FILES: ${ZALTR_MINIO_BUCKET_FILES:?}
      BUCKET_ASSETS: ${ZALTR_MINIO_BUCKET_ASSETS:?}
    restart: "no"

  backup:
    build: ./docker/backup
    image: zaltr/backup:local
    container_name: zaltr-backup
    restart: unless-stopped
    networks: [zaltr-net]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ZALTR_BACKUP_CRON: ${ZALTR_BACKUP_CRON:-5 3 * * *}
      ZALTR_BACKUP_KEEP_DAYS: ${ZALTR_BACKUP_KEEP_DAYS:-14}
      PGHOST: postgres
      PGDATABASE: ${ZALTR_POSTGRES_DB:?}
      PGUSER: ${ZALTR_POSTGRES_USER:?}
      PGPASSWORD: ${ZALTR_POSTGRES_PASSWORD:?}
      MINIO_URL: http://minio:9000
      MINIO_ROOT_USER: ${ZALTR_MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${ZALTR_MINIO_ROOT_PASSWORD:?}
      TZ: ${TZ:-Asia/Makassar}
    volumes:
      - ${ZALTR_BACKUP_DIR:?}:/backups
      - ./.env:/cfg/.env:ro
    secrets:
      - zaltr_backup_pass

  # ------------------------------------------------------------------
  # Web app zaltr.ai (Next.js standalone) — AKTIF TERUS:
  # restart unless-stopped + docker.service enabled = hidup 24/7 & tahan reboot.
  # Port host: ${ZALTR_WEB_BIND}:${ZALTR_WEB_PORT} -> 3000.
  # ------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: zaltr/web:local
    container_name: zaltr-web
    restart: unless-stopped
    networks: [zaltr-net, zaltr-exec]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${ZALTR_WEB_BIND:-127.0.0.1}:${ZALTR_WEB_PORT:-46300}:3000"
    environment:
      TZ: ${TZ:-Asia/Makassar}
      DATABASE_URL: postgresql://${ZALTR_POSTGRES_USER:?}:${ZALTR_POSTGRES_PASSWORD:?}@postgres:5432/${ZALTR_POSTGRES_DB:?}?schema=public
      # URL provider versi DALAM network zaltr-net (bukan loopback host)
      ZALTR_COPILOT_URL: ${ZALTR_WEB_COPILOT_URL:-copilot-runtime:4321}
      ZALTR_OLLAMA_URL: ${ZALTR_WEB_OLLAMA_URL:-http://ollama:11434}
      ZALTR_COMFYUI_URL: ${ZALTR_COMFYUI_URL:-}
      ZALTR_MINIO_URL: http://minio:9000
      ZALTR_MINIO_ROOT_USER: ${ZALTR_MINIO_ROOT_USER:?}
      ZALTR_MINIO_ROOT_PASSWORD: ${ZALTR_MINIO_ROOT_PASSWORD:?}
      ZALTR_MINIO_BUCKET_FILES: ${ZALTR_MINIO_BUCKET_FILES:?}
      ZALTR_PUBLIC_URL: ${ZALTR_PUBLIC_URL:-http://localhost:46300}
      ZALTR_GOOGLE_CLIENT_ID: ${ZALTR_GOOGLE_CLIENT_ID:-}
      ZALTR_GOOGLE_CLIENT_SECRET: ${ZALTR_GOOGLE_CLIENT_SECRET:-}
      ZALTR_GOOGLE_API_KEY: ${ZALTR_GOOGLE_API_KEY:-}
      # Batas byte unduhan per berkas Drive teks besar (kosong = default ~ pagu karakter, min 1MB)
      ZALTR_DRIVE_MAX_BYTES: ${ZALTR_DRIVE_MAX_BYTES:-}
      ZALTR_SEARXNG_URL: http://searxng:8080
      ZALTR_RUNNER_URL: http://runner:8484
      ZALTR_WA_ADMIN: ${ZALTR_WA_ADMIN:-}
      # Batas teks lampiran yang dibaca model (kosong = default 200rb/file, 300rb total)
      ZALTR_MAX_FILE_CHARS: ${ZALTR_MAX_FILE_CHARS:-}
      ZALTR_MAX_TOTAL_CHARS: ${ZALTR_MAX_TOTAL_CHARS:-}

  # ------------------------------------------------------------------
  # Web search self-hosted (fitur "Cari web" di chat). Internal-only.
  # ------------------------------------------------------------------
  searxng:
    image: searxng/searxng:latest
    container_name: zaltr-searxng
    restart: unless-stopped
    networks: [zaltr-net]
    environment:
      SEARXNG_SECRET: ${ZALTR_SEARXNG_SECRET:?}
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro

  # ------------------------------------------------------------------
  # Code interpreter (tombol "Jalankan" pada blok Python di chat).
  # Terkunci: network internal tanpa internet & tanpa akses service zaltr
  # lain, rootfs read-only, non-root, cap-drop ALL, mem/pids dibatasi.
  # ------------------------------------------------------------------
  runner:
    build: ./docker/runner
    image: zaltr/runner:local
    container_name: zaltr-runner
    restart: unless-stopped
    networks: [zaltr-exec]
    read_only: true
    tmpfs:
      - /tmp:size=64m
    mem_limit: 768m
    pids_limit: 128
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # ------------------------------------------------------------------
  # Profile "ai": runtime Copilot CLI headless (fase web menyusul).
  # Tidak berjalan default; aktifkan dengan: zaltrctl up ai
  # Token Enterprise HANYA lewat secret file, tidak pernah di image/env.
  # ------------------------------------------------------------------
  copilot-runtime:
    build:
      context: ./docker/copilot-runtime
      args:
        COPILOT_CLI_VERSION: ${ZALTR_COPILOT_CLI_VERSION:-1.0.75}
    image: zaltr/copilot-runtime:local
    container_name: zaltr-copilot-runtime
    restart: unless-stopped
    networks: [zaltr-net]
    profiles: [ai]
    secrets:
      - zaltr_copilot_token
    volumes:
      - zaltr_copilot_state:/home/copilot/.copilot
    environment:
      TZ: ${TZ:-Asia/Makassar}
    healthcheck:
      # Image runtime tidak punya wget/curl/nc — cek port langsung lewat bash.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/4321"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ------------------------------------------------------------------
  # Profile "gpu": Ollama milik zaltr SENDIRI (opsional).
  # Server ini sudah punya Ollama host di 11434-11436 milik pihak lain —
  # JANGAN dipakai/diganggu. Service ini memakai volume model terpisah.
  # ------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: zaltr-ollama
    restart: unless-stopped
    networks: [zaltr-net]
    profiles: [gpu]
    volumes:
      - zaltr_ollama:/root/.ollama
    environment:
      TZ: ${TZ:-Asia/Makassar}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
